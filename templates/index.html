<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitBuddy - AI Fitness Plan Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <h1>FitBuddy</h1>
        <p class="subtitle">AI Fitness Plan Generator</p>

        <form action="/generate" method="post">

            <label>Name</label>
            <input type="text" name="name" required>

            <label>User ID</label>
            <input type="text" name="user_id" required>

            <label>Age</label>
            <input type="number" name="age" min="13" required>

            <label>Weight (kg)</label>
            <input type="number" name="weight" step="0.1" min="1" required>

            <label>Fitness Goal</label>
            <select name="fitness_goal" required>
                <option value="">Select Goal</option>
                <option value="General Fitness">General Fitness</option>
                <option value="Strength">Strength</option>
                <option value="Flexibility">Flexibility</option>
                <option value="Endurance">Endurance</option>
            </select>

            <label>Workout Intensity</label>
            <select name="intensity" required>
                <option value="">Select Intensity</option>
                <option value="Low">Low</option>
                <option value="Moderate">Moderate</option>
                <option value="High">High</option>
            </select>

            <button type="submit">Generate My Plan</button>

        </form>
    </div>

</body>
</html>
